services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nestchat
      POSTGRES_USER: nestchat
      POSTGRES_PASSWORD: nestchat
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestchat -d nestchat']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://nestchat:nestchat@db:5432/nestchat?schema=public
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: local-compose-access-secret-change-me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      UPLOAD_DIR: /app/uploads
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  postgres-data:
